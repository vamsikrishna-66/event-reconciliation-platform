services:
  broker:
    image: redpandadata/redpanda:v24.3.8
    command: [redpanda, start, --mode, dev-container, --smp, '1', --advertise-kafka-addr, 'broker:9092']
    healthcheck:
      test: [CMD, rpk, cluster, health, --exit-when-healthy]
      interval: 3s
      timeout: 5s
      retries: 20
  topics:
    image: redpandadata/redpanda:v24.3.8
    entrypoint: [rpk]
    command: [topic, create, order-events, -X, brokers=broker:9092]
    depends_on:
      broker:
        condition: service_healthy
  emitter:
    build: .
    environment:
      BROKER_HTTP_URL: http://broker:8082
    depends_on:
      topics:
        condition: service_completed_successfully
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: synthetic
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h localhost -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ledger:/var/lib/postgresql/data
  reconciler:
    build: .
    command: [reconcile]
    environment:
      BROKER_HTTP_URL: http://broker:8082
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: synthetic
    depends_on:
      topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
volumes:
  ledger:
